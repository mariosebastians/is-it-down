services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: isitdown
      POSTGRES_PASSWORD: isitdown
      POSTGRES_DB: isitdown
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isitdown -d isitdown"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
